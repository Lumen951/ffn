[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ffn"
version = "0.1.0"
description = "Flood-Filling Networks for volumetric instance segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Michal Januszewski", email = "mjanusz@google.com" }]
keywords = [
  "connectomics",
  "electron microscopy",
  "flood-filling networks",
  "segmentation",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Processing",
]
urls = { Homepage = "https://github.com/google/ffn" }

# Dependencies of the TensorFlow training and inference path.
dependencies = [
  "absl-py>=0.1.4",
  # No Windows wheels (Linux/macOS only). ffn/input/volume.py imports it at
  # module level, so that module -- and ffn/jax/input_pipeline.py, which imports
  # it -- cannot be imported on Windows.
  "array-record; sys_platform != 'win32'",
  "connectomics",
  "edt>=2.3.0",
  "gin-config",
  "h5py>=2.7.0",
  "numpy>=1.11.1",
  "pandas",
  "Pillow>=5.3.0",
  # Must be at least the protoc release that generated the checked-in *_pb2.py
  # files; protobuf enforces this at import time. Regenerate them with:
  #   uv run --with grpcio-tools python -m grpc_tools.protoc -I. --python_out=. \
  #     ffn/utils/vector.proto ffn/utils/bounding_box.proto \
  #     ffn/inference/inference.proto ffn/inference/consensus.proto \
  #     ffn/inference/resegmentation.proto
  "protobuf>=7.35.1",
  "psutil",
  "scikit-image>=0.11.0",
  "scipy>=0.15.1",
  "tensorflow>=1.4.0",
  "tensorstore>=0.1.40",
  "tf-slim>=1.1.0",
]
# Deliberately not declared -- imports that no public package satisfies. Both
# are only used by modules that cannot run from this snapshot regardless, since
# those modules also import Google-internal packages.
#   * multidim-image-augmentation (ffn/training/augmentation.py): ships cp37/
#     cp38 wheels only, so it cannot resolve for Python 3.11. Build it from
#     source, or use Python 3.8.
#   * a top-level module named `tf` exposing `transformations` (same file):
#     `from tf import transformations` requires a module called `tf`. The PyPI
#     `transformations` package provides a module named `transformations`, so it
#     does not satisfy this import.

[project.optional-dependencies]
# JAX/Flax training: ffn/jax/ and ffn/secgan/.
jax = [
  "clu",
  "etils",
  "flax",
  "jax>=0.2.25",
  "jmp",
  "ml_collections",
  "optax",
  "orbax-checkpoint",
]
# Deliberately not declared: `t5x`, imported by ffn/jax/train.py for dataset
# checkpointing. Its PyPI release (0.0.0) was yanked, and the GitHub
# distribution pulls flax/optax/seqio/clu from git HEAD, which requires
# Python>=3.12 -- incompatible with the 3.11 pin above. Install it separately
# on a 3.12+ environment if you need that interop:
#   uv pip install "t5x @ git+https://github.com/google-research/t5x"
# ffn/utils/proofreading.py.
proofreading = ["neuroglancer", "networkx"]
# ffn/inference/inference.py imports IPython lazily for interactive display.
interactive = ["ipython"]
dev = ["flake8", "pyink", "pytest"]

[tool.setuptools.packages.find]
# `namespaces = true` (the default) is what picks up ffn/input and ffn/jax,
# which have no __init__.py.
include = ["ffn*"]

[tool.setuptools]
# Top-level scripts that setup.py used to install via `scripts=[...]`.
py-modules = [
  "build_coordinates",
  "compute_partitions",
  "run_inference",
  "train",
]

[tool.pyink]
line-length = 80
preview = true
pyink-indentation = 2
pyink-use-majority-quotes = true
